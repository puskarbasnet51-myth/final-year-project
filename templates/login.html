{% extends 'base.html' %}
{% block title %}Login - FeedForward{% endblock %}

{% block content %}
<div class="container" style="padding-top:60px; padding-bottom:60px;">
    <div style="max-width:440px; margin:0 auto;">
        <div class="card">
            <div class="card-header-green text-center">
                <h3 style="font-size:1.4rem; font-weight:700;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </h3>
            </div>
            <div class="card-body">
                <form method="POST" action="/login/">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" name="username"
                               class="form-control"
                               placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password"
                               class="form-control"
                               placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-green btn-full"
                            style="margin-top:8px;">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                <p class="text-center mt-3" style="margin-top:20px;">
                    No account?
                    <a href="/register/" style="color:var(--green-main);font-weight:600;">
                        Register here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
